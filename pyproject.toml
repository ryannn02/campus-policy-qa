[project]
name = "campus-policy-qa"
version = "0.1.0"
description = "上海第二工业大学校园制度问答系统（LangChain + RAG）"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 重新解析原始文件时才需要；只跑问答不必装
ingest = ["beautifulsoup4>=4.12", "pypdf>=4.0", "pymupdf>=1.24", "python-docx>=1.1", "rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campus_qa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
